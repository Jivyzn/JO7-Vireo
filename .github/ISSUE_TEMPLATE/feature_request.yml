name: Feature request
description: Propose an accessibility, reliability or reproducibility improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User need or engineering problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Accessibility, safety and failure-mode considerations
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Test or validation plan
